<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Game</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" type="text/css" href="../mainCss/mainCss.css">
</head>
<body>
    <div class="navbar">
        <a href="../mainPage/mainPage.html" class="homebutton">Home</a>
        <a href="../mainPage/mainPage.html#projects">Projects</a>
        <div class="dropdown">
            <a href="" class="aboutme">About Me</a>
            <div class="dropdown-content">
                <a href="../CV/cv.html">CV</a>
                <a href="../schedule/schedule.html">Schedule</a>
            </div>
        </div>
    </div>
    
    <div class="wordleTitle">WORDLE</div>
    
    <div class="wordle-grid" id="wordle-grid">
        <div class="row"><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>
        <div class="row"><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>
        <div class="row"><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>
        <div class="row"><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>
        <div class="row"><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>
        <div class="row"><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>
    </div>

    <div class="keyboard">
        <div class="key-row">
            <button class="key">Q</button><button class="key">W</button><button class="key">E</button><button class="key">R</button><button class="key">T</button><button class="key">Y</button><button class="key">U</button><button class="key">I</button><button class="key">O</button><button class="key">P</button>
        </div>
        <div class="key-row">
            <button class="key">A</button><button class="key">S</button><button class="key">D</button><button class="key">F</button><button class="key">G</button><button class="key">H</button><button class="key">J</button><button class="key">K</button><button class="key">L</button>
        </div>
        <div class="key-row">
            <button class="key enter">Enter</button>
            <button class="key">Z</button><button class="key">X</button><button class="key">C</button><button class="key">V</button><button class="key">B</button><button class="key">N</button><button class="key">M</button>
            <button class="key backspace">Backspace</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
